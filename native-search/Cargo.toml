[package]
name = "native-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "native_search"
crate-type = ["cdylib", "lib"]

[dependencies]
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "indexing_and_search"
harness = false

[profile.release]
panic = "unwind"
