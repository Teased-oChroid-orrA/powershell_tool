[package]
name = "native-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "native_search"
crate-type = ["cdylib", "lib"]

[dependencies]
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "indexing_and_search"
harness = false

[[bench]]
name = "trigram_candidate_reduction"
harness = false

# [profile.*] moved to the workspace root Cargo.toml - Cargo ignores
# per-crate profile sections for non-root workspace members (confirmed by
# a real build warning when native-search joined the Rust-rewrite
# workspace: "profiles for the non root package will be ignored").
