[package]
name = "bushing-solver"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Bushing interference-fit calculation engine, ported from
# ~/Claude/Projects/engineering.toolbox's TypeScript bushing workbench
# (src/lib/core/bushing/{solveEngine,solveMath,materials,reamerCatalog}.ts
# plus shared/{bearing,bushingProfileGeometry}.ts - a much larger tool
# that also covers service-duty/wear screening, process-route review, and
# standards/approval review). Straight, flanged, and countersunk (ID
# and/or OD) geometry, plus bore-tolerance auto-adjustment, are ported;
# the duty/process/approval layers are not - see
# docs/bushing-workbench-status.md in the powershell_tool repo for the
# exact scope decision and what's deliberately deferred.
#
# The physics (Lame thick-wall interference fit, tolerance-stack
# resolution, countersink corner-enumeration worst-case search, margins of
# safety) is ported line-for-line, not reinterpreted - verified against
# real golden output from the original TS engine for both a straight and
# a countersunk/flanged fixture (see tests/differential*.rs), the same
# "prove it against the real thing" discipline this repo's other ports
# use.
#
# Zero GUI dependency, deliberately - a pure calculation library `app/`
# consumes, same shape as search-core's own "zero GUI dependency" rule.
#
# `lame`/`materials` moved out to `mechanics-core` (issue #11 Phase 1 -
# see docs/issue-11-phase-1.md) - general, bushing-agnostic solid-
# mechanics primitives a pressure-vessel tool can now depend on too,
# without pulling in this crate's own bushing-specific geometry/
# countersink/bearing/reamer/tolerance code.
[dependencies]
mechanics-core = { path = "../mechanics-core" }

[dev-dependencies]
