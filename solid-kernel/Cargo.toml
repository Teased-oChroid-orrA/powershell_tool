[package]
name = "solid-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# B-rep solids for the FEA preprocessor (ADR-019). The part that does not need a C++ toolchain: a face-tagged,
# watertight surface mesh with signed-distance and per-face distance queries (BVH), and the tetrahedral volume
# meshing of it through `fea-core::tetmesh`. Modelling, booleans, fillets and STEP are native
# (OpenCascade was retired, ADR-023).
[dependencies]
fea-core = { path = "../fea-core" }

# Audited MIT OR Apache-2.0; bounded 2D chart CDT, not a CAD/3D kernel.
spade = "=2.15.1"

# Reuse locked RustCrypto SHA-256 for exact-source association identity.
sha2 = { version = "=0.10.9", default-features = false }
