[package]
name = "solid-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# B-rep solids for the FEA preprocessor (ADR-019). The part that does not need a C++ toolchain: a face-tagged,
# watertight surface mesh with signed-distance and per-face distance queries (BVH), and the tetrahedral volume
# meshing of it through `fea-core::tetmesh`. The `occt` feature adds the OpenCascade side (modelling, booleans,
# fillets, STEP, tessellation into that surface mesh); it compiles OCCT from source (about 25 minutes the first
# time, CMake required, `CMAKE_POLICY_VERSION_MINIMUM=3.5` with CMake 4), so it is off by default.
[features]
default = []
occt = ["dep:cadrum"]

[dependencies]
fea-core = { path = "../fea-core" }
cadrum = { version = "0.9", default-features = false, optional = true }
