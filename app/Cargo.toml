[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# "ocr" enables OCR fallback for image-only/scanned PDFs (search-core's
# own Cargo.toml has the full dependency rationale) - on by default here
# since this is the real end-user-facing GUI.
search-core = { path = "../search-core", features = ["ocr"] }
native-search = { path = "../native-search" }
bushing-solver = { path = "../bushing-solver" }
# "native" (not "desktop"): dioxus-native's Blitz renderer (WGPU+winit),
# no WebView involved - avoids wry/WebView2's hard machine-wide-runtime
# dependency (wry hardcodes browserExecutableFolder to null, so there is
# no supported way to bundle WebView2 app-locally; verified by reading
# wry-0.53.5/src/webview2/mod.rs directly, not assumed). Ships as a
# first-party dioxus 0.7 feature (dioxus-native pinned to the same 0.7.10
# version), not an unofficial fork.
dioxus = { version = "0.7", features = ["native", "logger"] }
rfd = "0.15"
open = "5"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Already pulled in transitively by dioxus-native (its own text-input
# copy/paste support) - declared explicitly here too so the "copy path"
# result-row action doesn't rely on that being an implementation detail
# that could change.
arboard = "3"
# Direct deps needed to hand-roll the launch sequence dioxus_native::launch_cfg
# normally does internally (see main.rs's `launch_with_drag_drop_support`):
# blitz-shell doesn't forward WindowEvent::DroppedFile/HoveredFile to the
# Dioxus app at all (verified against its source - see
# docs/epic-ui-performance-and-design.md's "Verified platform constraints"
# table), so this wraps `DioxusNativeApplication` in a thin
# `winit::application::ApplicationHandler` that intercepts those two events
# before delegating everything else to the real application unchanged.
winit = "0.30"
# "data-uri" enables blitz-shell::DataUriNetProvider - see
# app/src/net_provider.rs's doc comment for why the Bushing Workbench's
# pre-rendered LaTeX formula images (`<img src="data:...">`) need this and
# why it's this narrow provider, not blitz-net's full HTTP client.
blitz-shell = { version = "0.2", features = ["data-uri"] }
blitz-html = "0.2"
# Direct deps (already pulled in transitively by blitz-shell/dioxus-native)
# so net_provider.rs can name `Resource`/`NetProvider` itself instead of
# reaching through re-exports that could silently change shape upstream.
blitz-dom = "0.2"
blitz-traits = "0.2"
# Settings/recent-search persistence across relaunches (epic §22).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Filesystem watching (epic §21) - flags when the search folder changes
# since the last run. Native OS watch APIs (FSEvents/ReadDirectoryChangesW/
# inotify), not polling.
notify = "6"
# Decodes the bundled window icon PNG into the raw RGBA winit::window::Icon
# needs - "png" only (default-features off) since that's the one format
# actually used, not the full codec set.
image = { version = "0.25", default-features = false, features = ["png"] }
# Desktop completion notification (epic backlog #8) - native toast APIs
# (WinRT toast on Windows, NSUserNotificationCenter/UNUserNotification on
# macOS, D-Bus on Linux), not a custom in-app popup. Best-effort: a failed
# notification (e.g. a Windows AppUserModelID quirk for unpackaged/
# unsigned exes - a real, known rough edge for toast notifications from a
# plain win32 exe, not yet verified against an actual signed build of this
# app) is swallowed, same as this app's established pattern for the
# settings file and incremental cache - never a reason to interrupt the
# user or fail a search.
notify-rust = "4"
# Encodes the Bushing Workbench's pre-rendered LaTeX formula PNGs
# (embedded via `include_bytes!`) into `data:image/png;base64,...` `<img>`
# src strings - see bushing_workbench.rs's `formula_img_src`.
base64 = "0.22"

[dev-dependencies]
# Diagnostic only: lets bushing_visualizer's tests actually run the same
# `usvg::Tree::from_data` parse Blitz's own image loader
# (`blitz-dom-0.2.4/src/util.rs`'s `parse_svg`) performs on an embedded
# SVG `<img>` src, instead of only checking the SVG string looks
# superficially sane (`starts_with("<svg")` etc.) - the actual bug class
# under investigation is a render that's syntactically valid SVG text but
# fails (or silently degrades) at that specific parse step.
usvg = "0.45"
