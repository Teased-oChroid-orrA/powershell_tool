[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
search-core = { path = "../search-core" }
native-search = { path = "../native-search" }
# "native" (not "desktop"): dioxus-native's Blitz renderer (WGPU+winit),
# no WebView involved - avoids wry/WebView2's hard machine-wide-runtime
# dependency (wry hardcodes browserExecutableFolder to null, so there is
# no supported way to bundle WebView2 app-locally; verified by reading
# wry-0.53.5/src/webview2/mod.rs directly, not assumed). Ships as a
# first-party dioxus 0.7 feature (dioxus-native pinned to the same 0.7.10
# version), not an unofficial fork.
dioxus = { version = "0.7", features = ["native"] }
rfd = "0.15"
open = "5"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
