name: Build search-cli Windows executable

# Builds the `search-cli` headless entry point (issue #6 §60) for win-x64 on
# a Windows runner. Tests run in `ci.yml` (Linux, whole workspace), not here.
#
# `app` (dioxus-native) and `app-egui` (egui/eframe, its own standalone
# Cargo workspace) have been removed from this repository - `app-tui` (see
# `.github/workflows/app-tui-build.yml`) is now the sole GUI head. See root
# CLAUDE.md for the removal decision.

on:
  workflow_dispatch: {}
  # Release builds only; `ci.yml` is the per-push test gate.
  push:
    tags:
      - "v*"

jobs:
  search-cli-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-search-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build search-cli (release, win-x64)
        # Headless entry point (issue #6 §60) - proves search-core is
        # genuinely usable with no GUI dependency at all.
        run: cargo build --release -p search-cli --target x86_64-pc-windows-msvc

      - name: List published exe (for manual review in build logs)
        shell: pwsh
        run: |
          Get-Item "target/x86_64-pc-windows-msvc/release/search-cli.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload built search-cli exe
        uses: actions/upload-artifact@v4
        with:
          name: search-cli-win-x64
          path: target/x86_64-pc-windows-msvc/release/search-cli.exe
          if-no-files-found: error
