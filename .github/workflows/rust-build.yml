name: Rust workspace build and verify (search-core, native-search, app, search-cli)

# Verifies the Rust/Dioxus rewrite (search-core + native-search + the
# `app` Dioxus-native desktop head - see docs/rust-rewrite-status.md) and
# the `search-cli` headless entry point (issue #6 §60). search-core is
# deliberately zero-GUI-dependency (same invariant the old C#/WinUI split
# had for TextInFilesSearch.Core), so its own test job runs on Linux for
# speed; `app` and `search-cli` are real win-x64 builds and are built (and
# `app`'s published output inspected) on a Windows runner, same as the
# existing C#/WinUI workflow. `search-cli` shares `app`'s build job rather
# than getting its own, since both need the same toolchain/target/cache -
# a second Windows job would just double runner minutes for no benefit.
#
# `app` uses dioxus's "native" feature (dioxus-native / Blitz, WGPU+winit)
# rather than "desktop" (wry/WebView2) - wry hardcodes
# CreateCoreWebView2EnvironmentWithOptions's browserExecutableFolder to
# null (verified by reading wry-0.53.5/src/webview2/mod.rs directly), so
# there is no supported way to bundle a Fixed Version WebView2 Runtime
# app-locally with it; every wry-based build would depend on a
# machine-wide WebView2 install, violating this project's standing
# "fully self-contained, no host-machine dependency" requirement. Blitz
# has no WebView dependency at all - Windows' bundled D3D12 (always
# present) is the only runtime graphics dependency.

on:
  workflow_dispatch: {}
  # workflow_dispatch alone isn't reachable via the API/UI until this file
  # exists on the default branch (GitHub only registers manually-triggered
  # workflows from main) - this repo's convention is not to merge feature
  # branches to main without explicit approval, so a scoped push trigger
  # is how this workflow actually runs pre-merge. Narrow to this branch
  # rather than a blanket `push: {}` to avoid firing on every push once
  # merged (see build.yml's own history of being made manual-only for the
  # same "don't burn CI minutes on every push" reasoning).
  push:
    branches:
      - feature/issue-2-native-search-eval

jobs:
  search-core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-search-core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo test -p search-core
        # search-core has zero GUI dependency by design (same invariant
        # TextInFilesSearch.Core enforced) - this is the same guarantee
        # that lets it be developed and verified without a Windows
        # machine, run here on the fastest/cheapest runner rather than
        # trusted from a developer's machine. Includes the real
        # DOCX/PPTX/XLSX/ZIP/PDF fixture parity tests (tests/fixtures.rs).
        run: cargo test -p search-core

      - name: cargo test -p search-cli
        # search-cli is equally GUI-free (that's the whole point of the
        # headless entry point, issue #6 §60) - its own smoke test
        # (cli/tests/cli_smoke.rs) runs here too, cheaply, before the
        # Windows job spends time building the release exe.
        run: cargo test -p search-cli

  app-build-windows:
    runs-on: windows-latest
    needs: search-core-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build app (release, win-x64)
        run: cargo build --release -p app --target x86_64-pc-windows-msvc

      - name: Build search-cli (release, win-x64)
        # Headless entry point (issue #6 §60) - proves search-core is
        # genuinely usable without Dioxus, not just theoretically GUI-free.
        # No CI job built a Windows search-cli.exe before now - it had to
        # be built locally (`cargo build --release -p search-cli`).
        run: cargo build --release -p search-cli --target x86_64-pc-windows-msvc

      - name: Verify published exe does not link WebView2/wry
        # Real regression guard for the wry -> Blitz switch above: if a
        # future dependency change accidentally re-pulls wry (directly or
        # transitively), this build would silently reintroduce the
        # machine-wide WebView2 dependency this switch exists to avoid.
        # Checking the binary's imports is a build-time-checkable fact,
        # not an assumption.
        shell: pwsh
        run: |
          $exePath = "target/x86_64-pc-windows-msvc/release/app.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "app.exe was not found at $exePath - the release build did not produce the expected output."
            exit 1
          }
          # DLL import names are stored as plain ASCII strings in a PE
          # file's import table, so a raw byte scan finds them without
          # needing dumpbin.exe (which requires a full VS Developer Prompt
          # environment, not guaranteed to be on PATH here) - good enough
          # for a "did this dependency come back" regression guard.
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "(?i)WebView2Loader") {
            Write-Error "app.exe links WebView2Loader.dll - the wry/WebView2 dependency this project deliberately moved away from has been reintroduced. Check that dioxus's 'native' feature (not 'desktop') is still what's enabled in app/Cargo.toml."
            exit 1
          }
          Write-Host "Confirmed: app.exe does not link WebView2Loader.dll."

      - name: List published exe (for manual review in build logs)
        shell: pwsh
        run: |
          Get-Item "target/x86_64-pc-windows-msvc/release/app.exe" | Format-List Name, Length, LastWriteTime
          Get-Item "target/x86_64-pc-windows-msvc/release/search-cli.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload built app exe
        uses: actions/upload-artifact@v4
        with:
          name: TextInFilesSearch-rust-app-win-x64
          path: target/x86_64-pc-windows-msvc/release/app.exe
          if-no-files-found: error

      - name: Upload built search-cli exe
        uses: actions/upload-artifact@v4
        with:
          name: search-cli-win-x64
          path: target/x86_64-pc-windows-msvc/release/search-cli.exe
          if-no-files-found: error

  # app-egui is the in-progress egui/eframe migration (see
  # docs/issue-11-phase-14.md for why) - a separate job, not folded into
  # app-build-windows above, since it's a real win-x64 build of a
  # different binary and this repo's own convention (search-core vs. app)
  # is one job per distinct build target rather than widening an existing
  # one. `app/` stays the shipping build until this reaches full parity;
  # this job exists so a Windows compile regression in the new crate is
  # caught here, the same guarantee `app-build-windows` already gives the
  # Blitz build.
  app-egui-build-windows:
    runs-on: windows-latest
    needs: search-core-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-app-egui-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build app-egui (release, win-x64)
        run: cargo build --release -p app-egui --target x86_64-pc-windows-msvc

      - name: List published exe (for manual review in build logs)
        shell: pwsh
        run: |
          Get-Item "target/x86_64-pc-windows-msvc/release/app-egui.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload built app-egui exe
        uses: actions/upload-artifact@v4
        with:
          name: TextInFilesSearch-egui-app-win-x64
          path: target/x86_64-pc-windows-msvc/release/app-egui.exe
          if-no-files-found: error
