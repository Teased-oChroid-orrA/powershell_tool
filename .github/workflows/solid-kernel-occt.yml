name: Solid kernel (OpenCascade)

# The `occt` feature of `solid-kernel` links a prebuilt OpenCASCADE through the `cadrum` crate (downloaded by its build
# script), so it is its own job: run by hand or when the kernel or the volume mesher changes. Windows is the target. The default CI job covers everything that
# does not need a C++ toolchain. See docs/adr/ADR-019-solid-kernel-opencascade.md.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "solid-kernel/**"
      - "fea-core/src/tetmesh.rs"
      - ".github/workflows/solid-kernel-occt.yml"

concurrency:
  group: occt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occt:
    name: occt (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            features: occt
            rustflags: ""
          # The prebuilt OpenCascade for MSVC uses the dynamic CRT; the workspace forces `crt-static`, which cannot link it.
          # This job checks the code against the prebuilt with the dynamic CRT. It is not the shipping configuration.
          - name: windows-prebuilt-dynamic-crt
            os: windows-latest
            features: occt
            rustflags: "-C target-feature=-crt-static"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: runner CPU (see windows-tests.yml)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String)
          "avx2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported) avx512f=$([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported)"

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and the OpenCascade build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-occt-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-occt-${{ matrix.name }}-

      - name: cargo test -p solid-kernel -p fea-problem
        run: cargo test -p solid-kernel -p fea-problem --features ${{ matrix.features }}

  # OpenCascade built from source with the workspace's static CRT (the configuration the shipped exe needs). Slow, by hand.
  occt-windows-static-crt:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-occt-static-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-occt-static-
      - name: cargo test -p solid-kernel --features occt-source
        run: cargo test -p solid-kernel --features occt-source
