name: Screenshot the running app (manual)

# Manual-only: publishes the self-contained app exactly like build.yml, then
# actually launches it on the runner's real interactive desktop session
# (windows-latest runners have one - unlike Linux runners, GUI apps render
# and can be screen-captured) and uploads a PNG as proof it starts and
# renders, not just that it compiles. Not wired into the push/PR trigger in
# build.yml on purpose - this is a manual, on-demand check.

on:
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  screenshot:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (from the runner's Visual Studio install)
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore TextInFilesSearch.sln

      - name: Publish self-contained (win-x64, unpackaged)
        run: >
          msbuild src/TextInFilesSearch/TextInFilesSearch.csproj
          /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsAppSDKSelfContained=true
          /p:WindowsPackageType=None
          /p:PublishSingleFile=false
          /p:PublishDir="${{ github.workspace }}\publish\TextInFilesSearch\"
          /m /nologo /verbosity:minimal

      - name: Launch app and capture a screenshot
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish\TextInFilesSearch\TextInFilesSearch.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Published exe not found at $exe"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Started PID $($proc.Id), waiting for window to render..."

          $deadline = (Get-Date).AddSeconds(30)
          $hasWindow = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
            if ($proc.HasExited) {
              Write-Error "App exited early with code $($proc.ExitCode)."
              exit 1
            }
            if ($proc.MainWindowHandle -ne 0) { $hasWindow = $true; break }
          }

          if (-not $hasWindow) {
            Write-Error "App never reported a main window handle within 30s."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # Give WinUI a moment past first-handle to finish painting.
          Start-Sleep -Seconds 3

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)

          New-Item -ItemType Directory -Force -Path "screenshot" | Out-Null
          $outPath = Join-Path $env:GITHUB_WORKSPACE "screenshot\app.png"
          $bitmap.Save($outPath, [System.Drawing.Imaging.ImageFormat]::Png)

          $graphics.Dispose()
          $bitmap.Dispose()

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          Write-Host "Saved screenshot to $outPath"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshot/app.png
          if-no-files-found: error
