name: Windows tests

# The workspace tests on Windows, the platform the app ships on (`ci.yml` runs Linux only). Not a gate: it exists to
# surface platform-specific numerical or filesystem differences. Linking `app-tui`'s GPU stack needs no GPU here: its GPU
# tests are `#[ignore]`d.

on:
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: runner CPU (a numerical failure that appears only on some runners is correlated with this)
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String)
          "avx2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported) avx512f=$([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-windows-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-tests-
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast
