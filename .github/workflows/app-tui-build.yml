name: Build app-tui Windows executable

on:
  workflow_dispatch:
    inputs:
      occt:
        description: "Build with STEP / OpenCASCADE support (LGPL: ships the notices; needs the static-CRT OCCT build to link, see ADR-019)"
        type: boolean
        default: false
  # Release builds only.
  push:
    tags:
      - "v*"

jobs:
  build-app-tui-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-app-tui-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-app-tui-${{ runner.os }}-

      - name: Build app-tui (release, win-x64)
        shell: pwsh
        run: |
          if ("${{ inputs.occt }}" -eq "true") {
            cargo build --release -p app-tui --features occt-source,gpu-viewer --target x86_64-pc-windows-msvc
          } else {
            cargo build --release -p app-tui --features gpu-viewer --target x86_64-pc-windows-msvc
          }

      - name: Verify and list app-tui.exe
        shell: pwsh
        run: |
          $exePath = "target/x86_64-pc-windows-msvc/release/app-tui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "app-tui.exe was not found at $exePath - the release build did not produce the expected output."
            exit 1
          }
          Get-Item $exePath | Format-List Name, Length, LastWriteTime

      - name: Stage the release folder (the executable and its notices)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/app-tui.exe dist/
          Copy-Item THIRD-PARTY-NOTICES.md dist/
          Copy-Item licenses/* dist/licenses/
          # An OpenCASCADE build must not be published without the LGPL texts (THIRD-PARTY-NOTICES.md).
          foreach ($f in "THIRD-PARTY-NOTICES.md", "licenses/OpenCASCADE-LICENSE_LGPL_21.txt", "licenses/OpenCASCADE-OCCT_LGPL_EXCEPTION.txt") {
            if (-not (Test-Path "dist/$f")) { Write-Error "dist/$f is missing"; exit 1 }
          }
          Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - name: Upload app-tui release folder
        uses: actions/upload-artifact@v7
        with:
          name: app-tui-win-x64
          path: dist
          if-no-files-found: error
