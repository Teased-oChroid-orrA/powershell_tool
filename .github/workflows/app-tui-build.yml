name: Build app-tui Windows executable

on:
  workflow_dispatch:
    inputs:
      occt:
        description: "Build with STEP / OpenCASCADE support (LGPL: ships the notices; needs the static-CRT OCCT build to link, see ADR-019)"
        type: boolean
        default: false
  # Release builds only.
  push:
    tags:
      - "v*"

jobs:
  build-app-tui-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-app-tui-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-app-tui-${{ runner.os }}-

      - name: Build app-tui (release, win-x64)
        shell: pwsh
        run: |
          if ("${{ inputs.occt }}" -eq "true") {
            cargo build --release -p app-tui --features occt-source,gpu-viewer --target x86_64-pc-windows-msvc
          } else {
            cargo build --release -p app-tui --features gpu-viewer --target x86_64-pc-windows-msvc
          }

      - name: Verify and list app-tui.exe
        shell: pwsh
        run: |
          $exePath = "target/x86_64-pc-windows-msvc/release/app-tui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "app-tui.exe was not found at $exePath - the release build did not produce the expected output."
            exit 1
          }
          Get-Item $exePath | Format-List Name, Length, LastWriteTime

      - name: Verify bare executable opens the dashboard
        shell: pwsh
        run: |
          $app = Start-Process "target/x86_64-pc-windows-msvc/release/app-tui.exe" -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "app-tui.exe exited before opening the dashboard" }
              if ($app.MainWindowTitle -eq "GS Engineering Toolbench") { break }
            }
            if ($app.MainWindowTitle -ne "GS Engineering Toolbench") {
              throw "app-tui.exe did not open the Toolbench dashboard"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Stage the release folder (the executable and its notices)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/app-tui.exe dist/
          Copy-Item THIRD-PARTY-NOTICES.md dist/
          Copy-Item licenses/* dist/licenses/
          # An OpenCASCADE build must not be published without the LGPL texts (THIRD-PARTY-NOTICES.md).
          foreach ($f in "THIRD-PARTY-NOTICES.md", "licenses/OpenCASCADE-LICENSE_LGPL_21.txt", "licenses/OpenCASCADE-OCCT_LGPL_EXCEPTION.txt") {
            if (-not (Test-Path "dist/$f")) { Write-Error "dist/$f is missing"; exit 1 }
          }
          Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - name: Create high-compression 7-Zip package
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip was not found on the Windows runner" }
          & $sevenZip a -t7z -m0=LZMA -mx=9 -md=64m -ms=on `
            dist/app-tui-win-x64.7z dist/app-tui.exe dist/THIRD-PARTY-NOTICES.md dist/licenses
          if ($LASTEXITCODE -ne 0) { throw "7-Zip packaging failed with exit code $LASTEXITCODE" }
          & $sevenZip t dist/app-tui-win-x64.7z
          if ($LASTEXITCODE -ne 0) { throw "7-Zip archive verification failed with exit code $LASTEXITCODE" }

      - name: Package standalone 7za extractor
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip was not found on the Windows runner" }
          $extraArchive = Join-Path $env:RUNNER_TEMP "7z2605-extra.7z"
          Invoke-WebRequest "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-extra.7z" -OutFile $extraArchive
          $expectedHash = "f27a8f103c84785026edcba1f67faf1357225df9d19ddb0b7760d55947141bc7"
          $actualHash = (Get-FileHash $extraArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "7-Zip Extra archive SHA-256 mismatch" }
          $extraDir = Join-Path $env:RUNNER_TEMP "7zip-extra"
          & $sevenZip x $extraArchive "-o$extraDir" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip Extra extraction failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist/7za-extractor | Out-Null
          Copy-Item "$extraDir/x64/7za.exe" dist/7za-extractor/
          Copy-Item "$extraDir/License.txt" dist/7za-extractor/
          & dist/7za-extractor/7za.exe t dist/app-tui-win-x64.7z
          if ($LASTEXITCODE -ne 0) { throw "Standalone 7za could not verify the app archive" }

      - name: Upload app-tui release folder
        uses: actions/upload-artifact@v7
        with:
          name: app-tui-win-x64
          path: dist/app-tui-win-x64.7z
          compression-level: 0
          if-no-files-found: error

      - name: Upload standalone 7za extractor
        uses: actions/upload-artifact@v7
        with:
          name: 7za-extractor-win-x64
          path: dist/7za-extractor/*
          compression-level: 0
          if-no-files-found: error
