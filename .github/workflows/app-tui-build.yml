name: Build app-tui Windows executable

on:
  workflow_dispatch:
  # Release builds only.
  push:
    tags:
      - "v*"

jobs:
  build-app-tui-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-app-tui-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-app-tui-${{ runner.os }}-

      - name: Build app-tui (release, win-x64)
        shell: pwsh
        run: |
          cargo build --release -p app-tui --features gpu-viewer --target x86_64-pc-windows-msvc

      - name: Verify and list app-tui.exe
        shell: pwsh
        run: |
          $exePath = "target/x86_64-pc-windows-msvc/release/app-tui.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "app-tui.exe was not found at $exePath - the release build did not produce the expected output."
            exit 1
          }
          Get-Item $exePath | Format-List Name, Length, LastWriteTime

      - name: Verify bare executable opens the dashboard
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "app-tui.stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "app-tui.stderr.txt"
          $app = Start-Process "target/x86_64-pc-windows-msvc/release/app-tui.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $failure = $null
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) {
                $app.WaitForExit()
                $failure = "app-tui.exe exited before opening the dashboard (exit code 0x{0:X8})" -f $app.ExitCode
                break
              }
              if ($app.MainWindowTitle -eq "GS Engineering Toolbench") { break }
            }
            if (-not $failure -and $app.MainWindowTitle -ne "GS Engineering Toolbench") {
              $failure = "app-tui.exe did not open the Toolbench dashboard (window title '$($app.MainWindowTitle)')"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          if ($failure) {
            # What the exit left behind: the process's own output, the app's debug log (written to the launch folder),
            # and Windows' record of a crash (exception code and faulting module).
            Write-Host "::group::stdout"; if (Test-Path $out) { Get-Content $out }; Write-Host "::endgroup::"
            Write-Host "::group::stderr"; if (Test-Path $err) { Get-Content $err }; Write-Host "::endgroup::"
            Write-Host "::group::toolbench-debug.log"; if (Test-Path toolbench-debug.log) { Get-Content toolbench-debug.log -Tail 80 } else { "no toolbench-debug.log in $PWD" }; Write-Host "::endgroup::"
            Write-Host "::group::Windows Application log (app-tui.exe)"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "app-tui" } | Select-Object -First 3 | ForEach-Object { $_.Message }
            Write-Host "::endgroup::"
            throw $failure
          }

      - name: Stage the release folder (the executable and its notices)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/app-tui.exe dist/
          Copy-Item THIRD-PARTY-NOTICES.md dist/
          Copy-Item licenses/* dist/licenses/
          foreach ($f in "THIRD-PARTY-NOTICES.md") {
            if (-not (Test-Path "dist/$f")) { Write-Error "dist/$f is missing"; exit 1 }
          }
          Get-ChildItem -Recurse dist | Format-Table FullName, Length

      - name: Create ZIP package
        shell: pwsh
        run: |
          # Plain ZIP (Deflate, optimal): Windows opens it with Explorer, no extra tool needed.
          $zip = Join-Path $env:RUNNER_TEMP "app-tui-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path dist/app-tui.exe, dist/THIRD-PARTY-NOTICES.md, dist/licenses -DestinationPath $zip -CompressionLevel Optimal
          Move-Item $zip dist/app-tui-win-x64.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/app-tui-win-x64.zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            $names
            if ($names -notcontains "app-tui.exe") { throw "app-tui.exe missing from the ZIP" }
            $exe = $archive.GetEntry("app-tui.exe")
            $stream = $exe.Open(); $total = 0; $buf = New-Object byte[] 1MB
            while (($n = $stream.Read($buf, 0, $buf.Length)) -gt 0) { $total += $n }
            $stream.Dispose()
            if ($total -ne $exe.Length) { throw "app-tui.exe did not read back in full from the ZIP" }
          } finally { $archive.Dispose() }

      - name: Upload app-tui release folder
        uses: actions/upload-artifact@v7
        with:
          name: app-tui-win-x64
          path: dist/app-tui-win-x64.zip
          compression-level: 0
          if-no-files-found: error
