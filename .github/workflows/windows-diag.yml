name: Windows diagnostics

# Temporary: samples several hosted Windows runners (they are not all the same CPU) to find out where the numbers part on the
# ones that solved a 45k-dof Hex27 model to a wrong answer (docs/issue-12-phase-26.md). Cause found: private-gemm-x86 0.1.20
# returns wrong products on the AMD EPYC 7763 runners (fixed in 0.1.22, locked now). This run checks the fix on whichever
# hosts it gets; delete the workflow when it has been green on a 7763.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/windows-diag.yml"

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-windows-diag2-${{ matrix.sample }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-diag2-${{ matrix.sample }}-
      - name: cpu
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String)
          "avx2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported) avx512f=$([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported) avx512bw=$([System.Runtime.Intrinsics.X86.Avx512BW]::IsSupported)"
      - name: consistency of every way of solving the model
        run: cargo test -p fea-problem --test consistency -- --nocapture
      - name: the sweep test that failed
        if: always()
        run: cargo test -p fea-problem --test sweep random_linear -- --nocapture
