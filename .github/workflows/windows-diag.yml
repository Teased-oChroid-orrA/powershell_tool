name: Windows diagnostics

# Temporary: isolates the Windows-only equilibrium failure of `random_linear_problems_solve_and_balance`
# (docs/issue-12-phase-26.md). Delete once the cause is fixed. Hypothesis: a runner CPU with AVX-512 takes a different
# SIMD path in faer / gemm / pulp and that path is wrong for this case; the failing runs print identical wrong numbers.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/windows-diag.yml"

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-windows-diag-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-diag-
      - name: cpu
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String)
          "avx2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported) avx512f=$([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported) avx512bw=$([System.Runtime.Intrinsics.X86.Avx512BW]::IsSupported)"
      - name: build
        run: cargo test -p fea-problem --test sweep --no-run
      - name: the whole sweep binary (tests run concurrently)
        if: always()
        run: cargo test -p fea-problem --test sweep -- --nocapture
      - name: the one test alone
        if: always()
        run: cargo test -p fea-problem --test sweep random_linear -- --nocapture
      - name: the whole workspace's feature set, the one test
        if: always()
        run: cargo test --workspace --no-run
      - name: one test of the workspace build
        if: always()
        run: cargo test -p fea-problem --test sweep random_linear -- --nocapture
