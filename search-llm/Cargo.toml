[package]
name = "search-llm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# Off by default: compiles llama.cpp (CMake + C++ toolchain). Enabled by app-tui's `llm-find`.
llama = ["dep:llama-cpp-2"]

[dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "parse_probe"
required-features = ["llama"]
