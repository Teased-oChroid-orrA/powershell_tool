# Vendored copy of ocrs 0.12.2 (https://github.com/robertknight/ocrs, MIT OR Apache-2.0) with one change:
# `TextChar::confidence`, see NOTICE.md. Examples and dev-dependencies are dropped; sources are otherwise upstream.
[package]
edition = "2021"
name = "ocrs"
version = "0.12.2"
authors = ["Robert Knight"]
description = "OCR engine (vendored, adds per-character recognition confidence)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertknight/ocrs"
publish = false

[features]
onnx = ["rten/onnx_format"]

[lib]
name = "ocrs"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1.0.102"
rayon = "1.11.0"
rten-imageproc = "0.24.0"
rten-tensor = "0.24.0"
thiserror = "2.0.18"

[dependencies.rten]
version = "0.24.0"
features = ["rten_format"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.93"

[dev-dependencies]
fastrand = "2.3.0"

# Standalone: keeps `cargo test --manifest-path` here from walking up to an enclosing workspace.
[workspace]
