[package]
name = "search-cli"
version = "0.1.0"
edition = "2021"
publish = false

# Headless entry point for search-core (issue #6 §60 - "make it possible
# to have Dioxus GUI / CLI / future API, all built on the same core, and
# it also makes automated testing easier"). Proves search-core is
# actually usable without Dioxus, not just theoretically GUI-free - the
# whole reason this crate is a separate workspace member from search-core
# itself (see the root Cargo.toml's comment) rather than a `[[bin]]`
# there, so search-core's own [dependencies] stay exactly what the
# library needs.
[[bin]]
name = "search-cli"
path = "src/main.rs"

[dependencies]
# "ocr" enables OCR fallback for image-only/scanned PDFs (search-core's
# own Cargo.toml has the full dependency rationale) - on by default here
# since this is a real, end-user-facing binary; a caller embedding
# search-core as a library dependency without wanting the ~12MB model/
# dependency cost would omit it.
search-core = { path = "../search-core", features = ["ocr"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Interactive menu mode (`--interactive`, or bare invocation with no
# search folder given). Mature, widely-used (Input/Select/MultiSelect/
# Confirm prompts over a real terminal via the `console` crate, which uses
# the Windows Console API on win-x64 - no admin rights or extra runtime
# needed, satisfying CLAUDE.md's target-environment constraints). Chosen
# over hand-rolling raw stdin parsing because a real "menu system" (arrow-
# key selection, validated input, defaults) is exactly what it's for -
# reimplementing that unstyled would be strictly worse, not simpler.
dialoguer = "0.11"
# --list-failures prints FailureRecord as JSON. search-core already
# depends on serde_json for its own report export - a normal, expected
# dependency, not new surface area.
serde_json = "1"
# Installs a subscriber for search-core's tracing instrumentation (issue
# #6 §57/§58) - the GUI gets one for free via dioxus's "logger" feature,
# but the CLI has no such feature to lean on, so it needs its own. Quiet
# by default (WARN) - opt into search-core's discover/extract/index/query/
# export events with RUST_LOG=search_core=info (or =debug/=trace for the
# noisier per-file events), matching this crate's `env_logger`-family
# convention rather than a bespoke --verbose flag.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
