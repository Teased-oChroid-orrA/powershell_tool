[package]
name = "search-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "search_core"

# Zero GUI dependency, deliberately - mirrors TextInFilesSearch.Core's own
# "plain net8.0 class library, zero WinUI reference" invariant. This crate
# must stay `cargo test`-able on its own, without app/ (the Dioxus UI)
# ever being built - that property is the whole reason the original C#
# Core/head split existed, and it's the property this Rust rewrite exists
# to make actually usable locally (see docs/rust-rewrite-status.md).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Rust's `regex` crate has no lookaround (no backtracking, by design), but
# whole-word matching's boundary check needs it (see matching.rs's
# `whole_word_pattern` doc comment). fancy-regex 0.19 verified by real
# compile-and-test against the C# whole-word test cases before adopting.
fancy-regex = "0.19"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
native-search = { path = "../native-search" }
# DOCX/PPTX/XLSX/ZIP: the C# original reads these via .NET's ZipArchive +
# regex tag-stripping (no real OOXML parser), so `zip` fills the same role
# here rather than a format-specific crate that would extract differently.
zip = "2"
# PDF's /FlateDecode filter is raw DEFLATE (RFC1951, no zlib wrapper) - same
# as .NET's DeflateStream, which the C# original pairs with a manual 2-byte
# zlib-header skip.
flate2 = "1"
# Windows-1252 fallback decode for DecodeText - .NET pulls this from the
# OS/ICU; Rust has no such built-in, so this is the standard well-vetted
# crate for it (also used transitively by many other encoding-aware crates).
encoding_rs = "0.8"
# Async file reads with a hard per-file timeout, retry-with-backoff, and
# cooperative cancellation - ports FileReaderService.cs's ReadFileBytesRobustAsync.
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
# HTML report: banner data-URI embedding and the "Open original file" link.
base64 = "0.22"
urlencoding = "2"
# Persistent extraction-failure log (issue #6 §12/§16/§17/§50 - see
# failure_log.rs's module doc for why this is scoped to failures
# specifically, not a wholesale replacement of cache.rs's JSON result
# cache or Tantivy's own document metadata). "bundled" statically links
# SQLite's C amalgamation into the binary - required by this project's
# standing "no pre-installed runtime of any kind on the target machine"
# rule (see CLAUDE.md's "Target environment" section) - a plain `rusqlite`
# without this feature would need the host to already have a system
# SQLite library, which win-x64 machines aren't guaranteed to have.
rusqlite = { version = "0.32", features = ["bundled"] }
# Structured instrumentation (issue #6 §57/§58) - spans/events around
# discover/extract/index/query, aggregate-not-per-file log lines. Already
# pulled into this workspace transitively (dioxus's "logger" feature in
# app/Cargo.toml depends on tracing-subscriber) - this just makes
# search-core's own use of it a direct, explicit dependency instead of
# relying on a transitive one from a crate it doesn't otherwise depend on.
# A no-op with no subscriber installed (the GUI installs one via dioxus's
# logger feature; the CLI installs its own - see cli/src/main.rs), so
# this has zero behavioral cost for search-core's own test suite.
tracing = "0.1"
# Optional OCR support for image-only/scanned PDFs (no text-showing
# operators at all - a drawn page image, which the regex/content-stream
# extractor genuinely cannot get text from any other way). `ocrs`+`rten`
# were chosen after evaluating alternatives specifically against this
# project's standing "no pre-installed runtime, fully offline-capable"
# constraint: `rten` is a pure-Rust ONNX-model execution engine (no
# system ONNX Runtime, no Python, no libtorch - unlike `ort` or Tesseract
# bindings, which would need a real C/C++ runtime installed on the target
# machine). Its two `.rten` model files (~12MB total) are embedded into
# the binary via `include_bytes!`/`Model::load_static_slice` (see ocr.rs)
# rather than the CLI tool's own default of downloading them at first
# run, which would violate this app's "no internet access on the target
# machine" requirement. Feature-gated (not a default dependency) since
# it's a real ~12MB+ binary size and dependency-tree increase that only
# matters to callers who actually want OCR - `app`/`cli` enable it by
# default; a caller using `search-core` as a pure library doesn't pay for
# it unless they opt in.
# Pinned to exactly what ocrs 0.12.2 itself depends on (verified via
# Cargo.lock after a first build attempt pulled in two different rten
# versions from an unpinned/mismatched constraint here) - `rten`'s public
# types (like `Model`) aren't compatible across versions, so this crate's
# own `rten` dependency must resolve to the same version ocrs's
# `OcrEngineParams` expects, not just "any 0.x that satisfies semver."
ocrs = { version = "0.12", optional = true }
rten = { version = "=0.24.0", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

[features]
# JPEG only (via `image`'s "jpeg" feature) - DCTDecode is the filter
# essentially every real-world scanner/scan-to-PDF tool uses for a page
# image; CCITTFaxDecode (fax-style bilevel) and JPXDecode (JPEG2000) are
# real PDF filters this doesn't attempt, matching this extractor's
# established "skip what isn't confidently handled, never guess" rule
# rather than adding more image-format dependencies for formats not yet
# seen in a real reported case.
ocr = ["dep:ocrs", "dep:rten", "dep:image"]

[dev-dependencies]
tempfile = "3"

# Same philosophy as native-search/benches/indexing_and_search.rs (see
# docs/benchmarking.md): plain manual timing, harness = false, no
# criterion - "a small benchmark harness where practical," not a
# permanent perf-tracking suite.
[[bench]]
name = "discovery_and_extraction"
harness = false

[[bench]]
name = "concurrent_extraction"
harness = false

[[bench]]
name = "regex_query_shapes_at_scale"
harness = false

# Issue #8 "result processing breakdown" Known Gap: candidate generation /
# verification / snippet generation / result serialization, timed as four
# separate phases against real fixture files - see the file's own doc
# comment for the exact phase boundaries and why each is measured where
# it is.
[[bench]]
name = "result_processing_phases"
harness = false
