[package]
name = "app-egui"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace (own Cargo.lock/target/), NOT a member of the root
# powershell_tool workspace (see root Cargo.toml's `exclude` entry for this
# crate). Real, confirmed necessity, not a preference: on Windows, `app`
# (dioxus-native/Blitz) pulls fontique/parley, which hard-requires
# `windows ^0.58.0`, while this crate's wgpu-based rendering stack (via
# egui-wgpu -> wgpu-hal 29.x, and pinn-solver's burn-wgpu) hard-requires
# `windows-core ^0.62` - genuinely incompatible ranges that cannot both be
# satisfied by one shared Cargo.lock (confirmed via `cargo update -p
# windows@0.58.0 --precise 0.62.2`: "candidate versions found which didn't
# match", required by fontique's `^0.58.0`). Splitting this crate into its
# own workspace resolves each side's dependency graph independently -
# `app`'s stays on the windows ~0.58 family, this crate's on ~0.62 - with
# zero cross-contamination. Its path dependencies on sibling crates
# (search-core, native-search, bushing-solver, etc.) still work unchanged;
# each just gets resolved a second, independent time under this workspace's
# own lock instead of sharing the root one.
[workspace]

[dependencies]
# egui/eframe replace dioxus-native (Blitz) - see docs/issue-11-phase-14.md
# for why: position:sticky never implemented, transform invisible to
# hit-testing, and a proven-pattern :hover width toggle still failed after
# three attempts on that renderer. eframe wraps winit itself (same as
# dioxus-native did) - no WebView involved either way, so the original
# "no machine-wide runtime dependency" constraint (CLAUDE.md's "Why
# dioxus-native, not dioxus-desktop") still holds.
eframe = { version = "0.29", default-features = false, features = ["glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

search-core = { path = "../search-core", features = ["ocr"] }
native-search = { path = "../native-search" }
bushing-solver = { path = "../bushing-solver" }
mechanics-core = { path = "../mechanics-core" }
pressure-vessel-solver = { path = "../pressure-vessel-solver" }

# Stress Solver toolbox: reuses the PINN structural stress solver from the
# sibling NeuralNetwork-Stress-Solver checkout (a mature, separately-tested
# project - see its own CLAUDE.md) as a path dependency, not vendored/copied
# source - keeps ONE source of truth for the solver logic. `ndarray-backend`
# avoids a GPU/wgpu driver dependency for this bundled desktop tool (CPU-only
# burn backend, already a supported build configuration upstream).
pinn-core = { path = "../../../NeuralNetwork-Stress-Solver/crates/pinn-core" }
pinn-solver = { path = "../../../NeuralNetwork-Stress-Solver/crates/pinn-solver", features = ["ndarray-backend"] }
egui_plot = "0.29"
crossbeam-channel = "0.5"
toml = "0.8"
ndarray = "0.16"

rfd = "0.15"
open = "5"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(windows))'.dependencies]
# Windows-only, NOT `[dependencies]`: `notify-rust`'s Windows backend,
# `tauri-winrt-notification`, hard-requires `windows ^0.61` (no feature to
# disable it - `cfg(target_os = "windows")`, `optional = false` per its own
# Cargo.toml), which conflicts with the `windows-core ^0.62` this crate's
# wgpu-based rendering stack (via pinn-solver -> wgpu-hal) requires on
# Windows - a real upstream version conflict, not a local mistake (see
# search.rs's `notify_search_complete` doc comment, which is a Windows
# no-op for exactly this reason). Excluding it from the Windows dependency
# graph entirely is the only currently-available fix.
notify-rust = "4"

# SVG -> raster path for bushing_visualizer.rs's existing SVG-string output
# (reused verbatim - it never touched Dioxus). egui has no native SVG
# widget, so cross-section drawings rasterize through resvg/usvg into an
# egui::ColorImage instead of an `<img src="data:...">`.
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

[dev-dependencies]
tempfile = "3"
