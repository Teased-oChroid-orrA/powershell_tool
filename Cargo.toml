[workspace]
resolver = "2"
members = ["native-search", "search-core", "app-tui", "cli", "bushing-solver", "engineering-math", "mechanics-core", "pressure-vessel-solver", "fastened-joint-solver", "edge-check"]

# Moved here from native-search/Cargo.toml: Cargo ignores [profile.*]
# sections in non-root workspace members. panic="unwind" (not "abort") is
# required for native_search's cdylib since ffi.rs's catch_unwind-based
# panic guard (issue #2 Section 18 - no panic may cross into .NET) only
# works with unwinding, not abort.
[profile.release]
panic = "unwind"

# native-search/ keeps its own [package] (license, version) - unaffected by
# joining this workspace as a member. search-core/ is new (Rust rewrite of
# TextInFilesSearch.Core - see docs/adr/ for the architecture decisions and
# docs/rust-rewrite-status.md for the current port status), consumed by
# app-tui/ (the sole active GUI head - see root CLAUDE.md) and cli/.
# src/TextInFilesSearch(.Core)/ (the C#/WinUI app) stays in the repo,
# untouched, as a working reference during the transition - same treatment
# this repo already gives powershell/.
# cli/ (issue #6 §60) is a second, independent consumer of search-core -
# proof search-core is actually usable with no GUI dependency at all. A
# separate crate rather than a `[[bin]]` in search-core itself so
# search-core's own [dependencies] stay exactly what the library needs (no
# clap/arg-parsing pulled into every consumer, including app-tui/).

# The edge-distance cross-check is numerically heavy (complex-variable
# least squares, an FE solve, Monte Carlo) and runs on a key press from the
# TUI: keep it fast even in unoptimised dev builds.
[profile.dev.package.edge-check]
opt-level = 3
