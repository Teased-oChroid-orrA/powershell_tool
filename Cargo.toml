[workspace]
resolver = "2"
members = ["native-search", "search-core", "app", "cli", "bushing-solver", "engineering-math", "mechanics-core", "pressure-vessel-solver"]
# `app-egui` is DELIBERATELY excluded, not a member - see its own Cargo.toml's
# `[workspace]` stanza for why: it and `app` (this workspace) need genuinely
# incompatible major versions of the `windows`/`windows-core` crate family on
# Windows (fontique/parley - Blitz's font stack, an `app`-only dependency -
# hard-requires `windows ^0.58.0`; `app-egui`'s wgpu-hal 29.x rendering stack
# hard-requires `windows-core ^0.62`), so they cannot share one Cargo.lock.
exclude = ["app-egui"]

# Moved here from native-search/Cargo.toml: Cargo ignores [profile.*]
# sections in non-root workspace members. panic="unwind" (not "abort") is
# required for native_search's cdylib since ffi.rs's catch_unwind-based
# panic guard (issue #2 Section 18 - no panic may cross into .NET) only
# works with unwinding, not abort.
[profile.release]
panic = "unwind"

# native-search/ keeps its own [package] (license, version) - unaffected by
# joining this workspace as a member. search-core/ and app/ are new (Rust
# rewrite of TextInFilesSearch.Core and the WinUI head, respectively - see
# docs/adr/ for the architecture decisions and docs/rust-rewrite-status.md
# for the current port status). src/TextInFilesSearch(.Core)/ (the C#/WinUI
# app) stays in the repo, untouched, as a working reference during the
# transition - same treatment this repo already gives powershell/.
# cli/ (issue #6 §60) is a second, independent consumer of search-core -
# proof search-core is actually usable without Dioxus, not just
# theoretically GUI-free. A separate crate rather than a `[[bin]]` in
# search-core itself so search-core's own [dependencies] stay exactly what
# the library needs (no clap/arg-parsing pulled into every consumer,
# including app/).
