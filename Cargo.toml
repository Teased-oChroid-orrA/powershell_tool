[workspace]
resolver = "2"
members = ["native-search", "search-core", "app-tui", "cli", "bushing-solver", "engineering-math", "mechanics-core", "pressure-vessel-solver", "fastened-joint-solver", "edge-check", "lug-solver", "fea-core", "fea-problem", "eccentric-bushing", "solid-kernel"]

# Moved here from native-search/Cargo.toml: Cargo ignores [profile.*]
# sections in non-root workspace members. panic="unwind" (not "abort") is
# required: app-tui's worker threads and native-search's writer-death
# recovery rely on catch_unwind, which only works with unwinding.
[profile.release]
panic = "unwind"

# native-search/ keeps its own [package] (license, version) - unaffected by
# joining this workspace as a member. search-core/ is new (Rust rewrite of
# the former C# TextInFilesSearch.Core - see docs/adr/ for the architecture decisions and
# docs/rust-rewrite-status.md for the current port status), consumed by
# app-tui/ (the sole active GUI head - see root CLAUDE.md) and cli/.
# cli/ (issue #6 §60) is a second, independent consumer of search-core -
# proof search-core is actually usable with no GUI dependency at all. A
# separate crate rather than a `[[bin]]` in search-core itself so
# search-core's own [dependencies] stay exactly what the library needs (no
# clap/arg-parsing pulled into every consumer, including app-tui/).

# The edge-distance cross-check is numerically heavy (complex-variable
# least squares, an FE solve, Monte Carlo) and runs on a key press from the
# TUI: keep it fast even in unoptimised dev builds.
[profile.dev.package.lug-solver]
opt-level = 3

[profile.dev.package.edge-check]
opt-level = 3

[profile.dev.package.fea-core]
opt-level = 3

# The sparse factorisations of the lug / FE kernel run in faer (and rayon, gemm, pulp ...): dependencies are
# optimised even in dev builds, or a lug analysis takes minutes under `cargo run` / `cargo test`.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.fea-problem]
opt-level = 3

# The eccentric-bushing solver meshes and solves contact FE models on a key press: keep it fast in dev builds.
[profile.dev.package.eccentric-bushing]
opt-level = 3

# The surface-distance queries of the solid kernel run per lattice vertex while meshing: keep them fast in dev builds.
[profile.dev.package.solid-kernel]
opt-level = 3
